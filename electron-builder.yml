appId: com.mivaille777.jobflow
productName: JobFlow
copyright: Copyright © 2026 mivaille777

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

win:
  icon: build/icon.svg
  executableName: JobFlow
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JobFlow
  artifactName: JobFlow-${version}-Setup.${ext}
