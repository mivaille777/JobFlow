appId: com.mivaille777.jobflow
productName: JobFlow

directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JobFlow
  artifactName: JobFlow Setup.${ext}
