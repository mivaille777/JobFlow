name: Release v0.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - Prototype
    paths:
      - '.release/v0.1.1.ready'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Electron E2E
        run: xvfb-run -a npm run test:e2e

  release-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path (Join-Path $PWD 'release') -Filter 'JobFlow-0.1.1-Setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'JobFlow-0.1.1-Setup.exe was not produced.'
          }
          if ($installer.Length -le 0) {
            throw 'Installer is empty.'
          }
          Write-Host "Release installer verified: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path (Join-Path $PWD 'release') -Filter 'JobFlow-0.1.1-Setup.exe' | Select-Object -First 1
          gh release view 'v0.1.1' --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload 'v0.1.1' $installer.FullName --clobber
            gh release edit 'v0.1.1' --title 'JobFlow v0.1.1' --notes-file 'RELEASE_NOTES_v0.1.1.md'
            Write-Host 'Updated existing v0.1.1 release.'
          } else {
            gh release create 'v0.1.1' $installer.FullName --target $env:GITHUB_SHA --title 'JobFlow v0.1.1' --notes-file 'RELEASE_NOTES_v0.1.1.md'
            Write-Host 'Created v0.1.1 release.'
          }
